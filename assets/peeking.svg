<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322" role="img" aria-label="How often two identical commands get a “winner”"><rect x="0.5" y="0.5" width="759" height="321" rx="12" fill="#ffffff" stroke="#d1d9e0"/><text x="28" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f2328">How often two identical commands get a “winner”</text><text x="28" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#59636e">Simulated: 2,000 comparisons of identical coins (p = 0.7). Every “win” here is a false one.</text><text x="28" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328">Check once, at the end</text><rect x="300" y="97" width="78.1" height="26" rx="5" fill="#0969da"/><text x="388.1" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">3.8%</text><text x="28" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328">Check at 5 points, stop at p &lt; 0.05</text><rect x="300" y="141" width="193.2" height="26" rx="5" fill="#bc4c00"/><text x="503.2" y="159" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">9.4%</text><text x="28" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328">Check after every single run</text><rect x="300" y="185" width="328.9" height="26" rx="5" fill="#cf222e"/><text x="638.9" y="203" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">16%</text><text x="28" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328" font-weight="600">lucky --until-decided</text><rect x="300" y="229" width="36.0" height="26" rx="5" fill="#1a7f37"/><text x="346.0" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">1.75%</text><text x="28" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">The promise is ≤ 5%. Peeking breaks it; lucky&#x27;s pre-declared looks keep it.</text></svg>
